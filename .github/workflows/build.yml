name: Build Android & iOS on Commit

on:
  push:
    branches:
      - testfastlane  # Change to your deployment branch

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install

      - name: Set up Fastlane
        run: gem install fastlane

      - name: Build Android APK
        run: fastlane android beta

  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install

      - name: Set up Fastlane
        run: gem install fastlane

      - name: Build iOS App
        run: fastlane ios beta
